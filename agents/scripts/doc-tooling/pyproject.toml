[project]
name = "doc-tooling"
version = "0.1.0"
description = "Batch conversion of documents (PDF, DOCX) to Markdown using Docling"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0.0",
]

[project.scripts]
convert = "src.convert:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
